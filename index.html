<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS 1.0</title>

<meta name="description"
content="Nexus 1.0 — Seu assistente. Sua rotina. Seu controle.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#02060b;
    color:#ffffff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:
        radial-gradient(circle at top,#0b2035 0,#03070c 42%,#020408 100%);
    padding-bottom:90px;
}

/* =========================
   CABEÇALHO
========================= */

.topo{
    padding:22px 18px 18px;
    border-bottom:1px solid #12324a;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(2,7,12,.94);
    backdrop-filter:blur(12px);
}

.logo{
    color:#00aaff;
    font-size:29px;
    font-weight:800;
    letter-spacing:5px;
}

.logo-sub{
    color:#7890a3;
    font-size:12px;
    margin-top:5px;
}

.status-online{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    color:#80a0b5;
    font-size:12px;
}

.status-bolinha{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#00d084;
    box-shadow:0 0 10px #00d084;
}

/* =========================
   TELAS
========================= */

.tela{
    display:none;
    padding:22px 17px;
}

.tela.ativa{
    display:block;
    animation:entrada .22s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:28px;
    margin-bottom:7px;
}

h2{
    font-size:19px;
    margin-bottom:7px;
}

h3{
    font-size:16px;
    margin-bottom:6px;
}

.subtitulo{
    color:#8499a9;
    line-height:1.5;
    margin-bottom:20px;
}

/* =========================
   CARTÕES
========================= */

.card{
    background:rgba(7,18,29,.92);
    border:1px solid #12324a;
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
}

.card p{
    color:#9aabb8;
    line-height:1.55;
}

.card-destaque{
    border-color:#006fae;
    box-shadow:0 0 25px rgba(0,145,255,.08);
}

/* =========================
   BOTÕES
========================= */

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    color:white;
    background:#008cff;
    font-size:15px;
    font-weight:bold;
    margin-top:10px;
}

.btn:active{
    transform:scale(.98);
}

.btn-secundario{
    background:#0b1b29;
    border:1px solid #1a405a;
}

.btn-perigo{
    background:#40151c;
    border:1px solid #762733;
}

.btn-pequeno{
    width:auto;
    padding:10px 13px;
    font-size:13px;
}

.voltar{
    background:transparent;
    border:none;
    color:#00aaff;
    font-size:14px;
    margin-bottom:18px;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.menu-card{
    min-height:110px;
    padding:16px;
    background:#07131f;
    color:white;
    border:1px solid #12324a;
    border-radius:17px;
    text-align:left;
}

.menu-card:active{
    transform:scale(.98);
}

.menu-icone{
    font-size:30px;
    display:block;
    margin-bottom:10px;
}

.menu-titulo{
    display:block;
    font-size:15px;
    font-weight:bold;
}

.menu-descricao{
    display:block;
    color:#708696;
    font-size:11px;
    margin-top:4px;
}

/* =========================
   NEXUS / VOZ
========================= */

.nexus-centro{
    text-align:center;
}

.nexus-orbe{
    width:145px;
    height:145px;
    margin:25px auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    background:
        radial-gradient(circle,#0c9fff 0,#075080 38%,#03111e 72%);
    border:1px solid #168dcc;
    box-shadow:
        0 0 25px rgba(0,153,255,.25),
        inset 0 0 25px rgba(0,153,255,.2);
}

.nexus-orbe.ouvindo{
    animation:pulsar 1s infinite;
}

@keyframes pulsar{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 25px rgba(0,153,255,.25);
    }
    50%{
        transform:scale(1.07);
        box-shadow:0 0 55px rgba(0,153,255,.6);
    }
}

#resultadoVoz{
    min-height:50px;
    color:#91a7b6;
    line-height:1.5;
}

/* =========================
   FORMULÁRIOS
========================= */

input,
textarea,
select{
    width:100%;
    background:#030911;
    color:#fff;
    border:1px solid #173b55;
    border-radius:12px;
    padding:13px;
    outline:none;
    margin-top:8px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#008cff;
}

textarea{
    min-height:160px;
    resize:vertical;
}

label{
    display:block;
    color:#91a4b2;
    font-size:13px;
    margin-top:12px;
}

/* =========================
   LISTAS
========================= */

.lista{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.item{
    background:#07131e;
    border:1px solid #123149;
    border-radius:13px;
    padding:13px;
}

.item-topo{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-titulo{
    font-weight:bold;
}

.item-info{
    color:#7e94a4;
    font-size:12px;
    margin-top:4px;
}

/* =========================
   VALORES
========================= */

.valor-grande{
    color:#00aaff;
    font-size:30px;
    font-weight:bold;
}

.valor-verde{
    color:#00d084;
}

.valor-vermelho{
    color:#ff6474;
}

.resumo-financeiro{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.resumo{
    background:#06111c;
    border:1px solid #123149;
    border-radius:14px;
    padding:13px;
}

.resumo small{
    color:#708696;
    display:block;
    margin-bottom:6px;
}

.resumo strong{
    font-size:17px;
}

/* =========================
   CHECKLIST
========================= */

.check{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #102536;
}

.check input{
    width:20px;
    height:20px;
    margin:0;
}

/* =========================
   NAVEGAÇÃO
========================= */

.navegacao{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(520px,100%);
    height:76px;
    background:rgba(4,11,18,.97);
    border-top:1px solid #123149;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
    backdrop-filter:blur(15px);
}

.nav-btn{
    border:none;
    background:transparent;
    color:#60798a;
    font-size:10px;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:4px;
}

.nav-btn.ativo{
    color:#00aaff;
}

/* =========================
   CONFIGURAÇÕES
========================= */

.config-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #102536;
}

.config-item:last-child{
    border-bottom:none;
}

.config-esquerda strong{
    display:block;
    margin-bottom:4px;
}

.config-esquerda small{
    color:#708696;
}

.switch{
    width:48px;
    height:26px;
    border-radius:20px;
    background:#243746;
    position:relative;
    border:none;
}

.switch::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    top:3px;
    left:4px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch.ligado{
    background:#008cff;
}

.switch.ligado::after{
    left:24px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(20px);
    background:#102332;
    border:1px solid #24506b;
    padding:12px 16px;
    border-radius:12px;
    color:white;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:300;
    max-width:90%;
    text-align:center;
    font-size:13px;
}

.toast.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:360px){

    .grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:25px;
    }

    h1{
        font-size:25px;
    }
}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     CABEÇALHO
========================= -->

<header class="topo">

    <div class="logo">NEXUS</div>

    <div class="logo-sub">
        Seu assistente. Sua rotina. Seu controle.
    </div>

    <div class="status-online">
        <span class="status-bolinha"></span>
        Nexus
